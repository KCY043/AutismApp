services:
  backend:
    build: .
    container_name: autism_backend
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - C:/models/vicuna:/models  # 挂載本地模型資料夾
    environment:
      - MODEL_PATH=/models
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    tty: true
    stdin_open: true
