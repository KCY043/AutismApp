
services:
  ai_model:
    build: ./ai_model
    container_name: autism_ai_model
    ports:
      - "8001:8001"


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: autism_backend
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: autism_frontend
    ports:
      - "8080:80"
    networks:
      - autism_network

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - autism_network

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    networks:
      - autism_network

networks:
  autism_network: